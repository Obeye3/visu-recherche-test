[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "visu-recherche"
version = "0.1.0"
description = "Exploration des publications scientifiques S2A par modélisation de sujets LDA"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "Flask>=3.0,<4",
  "beautifulsoup4>=4.12,<5",
  "latexcodec>=3,<4",
  "requests>=2.32,<3",
  "PyMuPDF>=1.24,<2",
  "gensim>=4.4,<5",
  "pyLDAvis>=3.4,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "build>=1,<2"]
nlp = ["spacy>=3.8,<4", "langdetect>=1.0.9,<2"]

[project.scripts]
visu-recherche = "visu_recherche.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
visu_recherche = ["templates/*.html", "static/*.css", "data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["experiments", "data", "results", "docs/history"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
